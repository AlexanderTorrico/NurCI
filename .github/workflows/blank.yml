
name: CI


on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    
    runs-on: ubuntu-latest
    steps:
      
      - uses: actions/checkout@v4
      
      - name: Run Saludo
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run variables
        run: |
          echo "Carpeta $(pwd)"
          echo "Usuario $(whoami)"

      - name: Mi lista
        run: ls -la
