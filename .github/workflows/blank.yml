
name: CI


on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOMAIN: https://miapp.com

jobs:
  build:
    
    runs-on: ubuntu-latest
    steps:
      
      - name: Descarga el codigo
        uses: actions/checkout@v4

        
      - name: Descarga Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      
      - name: Run Saludo
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run variables
        run: |
          echo "Carpeta $(pwd)"
          echo "Usuario $(whoami)"
          echo "Dominio $DOMAIN"

      - name: Mi lista
        run: ls -la


      - name: Mi packagejson
        run: cat package.json

      - name: Instalar dependencias
        run: npm ci

      - name: Iniciar test
        run: npm test
